# -*- coding: utf-8 -*-
# 常见问题FAQ配置

faqs:
  # 配送相关
  - keywords: ["配送", "发货", "多久", "几天", "什么时候到", "配送时间", "发货时间"]
    question: "配送时间是多久？"
    answer: |
      📦 配送时间说明：
      • 普通商品：下单后1-2个工作日发货，3-5个工作日送达
      • 预售商品：按商品页面标注的时间发货
      • 生鲜商品：下单后24小时内发货，1-3天送达

      您可以在"我的订单"中查看物流详情。

  - keywords: ["包邮", "运费", "邮费", "快递费"]
    question: "运费怎么算？"
    answer: |
      🚚 运费政策：
      • 订单满99元包邮（偏远地区除外）
      • 不满99元收取8元运费
      • 偏远地区（新疆、西藏、内蒙古等）加收10元

      具体运费以结算页面显示为准。

  - keywords: ["快递", "什么快递", "物流公司"]
    question: "用什么快递？"
    answer: |
      📮 合作快递公司：
      • 顺丰速运
      • 京东物流
      • 中通快递
      • 圆通速递
      • 韵达快递

      系统会根据收货地址自动选择最优快递。

  # 退换货相关
  - keywords: ["退货", "退款", "退换", "退货政策", "可以退吗"]
    question: "退货政策是什么？"
    answer: |
      🔄 退货政策：
      • 7天无理由退货（商品未使用、包装完好）
      • 15天质量问题包退换
      • 退货流程：申请退货 → 审核通过 → 寄回商品 → 退款到账

      退款将在收到商品后3-5个工作日内原路返回。

  - keywords: ["换货", "换货政策", "可以换吗"]
    question: "换货政策是什么？"
    answer: |
      🔁 换货政策：
      • 15天内可申请换货
      • 支持换颜色、换尺码
      • 换货流程：申请换货 → 审核通过 → 寄回商品 → 重新发货

      换货商品将在收到原商品后2个工作日内发出。

  - keywords: ["退款", "多久退款", "退款时间"]
    question: "退款多久到账？"
    answer: |
      💰 退款时间：
      • 审核通过后3-5个工作日到账
      • 退款将原路返回（支付宝/微信/银行卡）
      • 如超过7天未到账，请联系客服查询

  # 支付相关
  - keywords: ["支付", "付款", "怎么付", "支付方式"]
    question: "支持哪些支付方式？"
    answer: |
      💳 支付方式：
      • 微信支付
      • 支付宝
      • 银行卡支付
      • 货到付款（部分地区）

      所有支付渠道均支持分期付款。

  - keywords: ["分期", "花呗", "信用卡分期"]
    question: "可以分期付款吗？"
    answer: |
      📅 分期付款：
      • 支持花呗分期（3/6/12期）
      • 支持信用卡分期（3/6/12期）
      • 分期手续费由平台承担

      具体分期方案以结算页面显示为准。

  # 账户相关
  - keywords: ["密码", "忘记密码", "修改密码"]
    question: "如何修改密码？"
    answer: |
      🔐 修改密码：
      1. 进入"我的" → "设置" → "账户安全"
      2. 点击"修改密码"
      3. 输入原密码和新密码
      4. 完成验证即可

  - keywords: ["注销", "注销账号", "删除账号"]
    question: "如何注销账号？"
    answer: |
      ⚠️ 注销账号：
      注销前请注意：
      • 所有未完成的订单将被取消
      • 账户余额将清零
      • 优惠券将失效

      如需注销，请联系人工客服处理。

  # 优惠相关
  - keywords: ["优惠券", "券", "优惠码"]
    question: "如何使用优惠券？"
    answer: |
      🎫 优惠券使用：
      1. 在结算页面选择"使用优惠券"
      2. 选择可用的优惠券
      3. 系统自动计算优惠金额

      注意：每笔订单只能使用一张优惠券。

  - keywords: ["会员", "积分", "会员等级"]
    question: "会员积分怎么用？"
    answer: |
      👑 会员积分：
      • 消费1元=1积分
      • 100积分=1元（可在结算时抵扣）
      • 积分有效期：自获取之日起1年

      会员等级：
      • 普通会员：0-999积分
      • 银卡会员：1000-4999积分
      • 金卡会员：5000-19999积分
      • 钻石会员：20000+积分

  # 售后相关
  - keywords: ["投诉", "投诉电话", "客服电话"]
    question: "如何联系客服？"
    answer: |
      📞 联系客服：
      • 在线客服：7×24小时在线
      • 客服电话：400-xxx-xxxx（9:00-21:00）
      • 邮箱：service@example.com

      如需投诉，请在对话中说明，我们会优先处理。

  - keywords: ["发票", "开发票", "电子发票"]
    question: "如何开发票？"
    answer: |
      📄 开发票：
      1. 订单完成后，在订单详情页点击"申请发票"
      2. 选择发票类型（个人/企业）
      3. 填写发票信息
      4. 电子发票将在24小时内发送至邮箱

      支持增值税普通发票和电子发票。

  # 其他
  - keywords: ["营业时间", "工作时间", "客服时间"]
    question: "客服工作时间？"
    answer: |
      🕐 客服工作时间：
      • 在线客服：7×24小时
      • 电话客服：9:00-21:00
      • 售后处理：9:00-18:00

  - keywords: ["质量", "正品", "假货"]
    question: "商品质量有保障吗？"
    answer: |
      ✅ 质量保障：
      • 所有商品均为正品行货
      • 支持官方验货
      • 假一赔十
      • 7天无理由退货

      请放心购买！
